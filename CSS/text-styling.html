<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Text Styling</title>
        <style>
            /* typography */
            .mcjava h1 {
                color: blue;
                font-family: Arial, sans-serif;
                font-size: 36px;
            }

            .mcbedrock h1 {
                color: green;
                font-family: Georgia, serif;
                font-size: 32px;
                text-decoration: line-through;
                transform:scale(1.3);
                
            }

            .mc h1 {
                color: red;
                font-family: Impact, sans-serif;
                font-size: 34px;
                font-style:oblique;
                text-decoration:underline;
                text-shadow: 2px 2px 4px #000000;
            }
        </style>
    </head>
    <body>
        <div class="mcjava">
            <h1>Text Styling</h1>
            <br>
            <p>Styled text example 1</p>
        </div>
        <br>
        <div class="mcbedrock">
            <h1>Text Styling</h1>
            <br>
            <p>Styled text example 2</p>
        </div>
        <br>
        <div class="mc">
            <h1>Text Styling</h1>
            <br>
            <p>Styled text example 3</p>
        </div>
    </body>
</html>

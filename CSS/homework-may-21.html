            padding: 20px;
            border-radius: 12px;

            font-weight: 800;
            margin-bottom: 10px;

        .info-title {
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }

        ul {
            text-align: left;
            padding-left: 20px;
        }
    </style>

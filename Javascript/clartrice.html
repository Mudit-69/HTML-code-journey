<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        .calculator {
            background-color: #1e222b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 320px;
        }

        .display {
            width: 100%;
            height: 80px;
            background-color: #282c34;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 2rem;
            text-align: right;
            padding: 0 15px;
            pointer-events: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            font-size: 1.25rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #3e4451;
            color: #ffffff;
            transition: background-color 0.1s ease;
        }

        button:active {
            background-color: #4b5263;
        }

        button.operator {
            background-color: #98c379;
            color: #1e222b;
            font-weight: bold;
        }

        button.operator:active {
            background-color: #a3cc86;
        }

        button.clear {
            background-color: #e06c75;
            color: #ffffff;
        }

        button.clear:active {
            background-color: #e57c83;
        }

        button.equal {
            background-color: #61afef;
            color: #1e222b;
            grid-column: span 2;
            font-weight: bold;
        }

        button.equal:active {
            background-color: #72ba99;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" class="display" id="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="backspace()">⌫</button>
        <button class="operator" onclick="appendOperator('/')">/</button>
        <button class="operator" onclick="appendOperator('*')">×</button>
        
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('-')">-</button>
        
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="appendOperator('+')">+</button>
        
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button onclick="appendNumber('.')">.</button>
        
        <button onclick="appendNumber('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    let resetDisplay = false;

    function appendNumber(number) {
        if (display.value === 'Error' || resetDisplay) {
            display.value = '';
            resetDisplay = false;
        }
        // Prevent multiple decimals
        if (number === '.' && display.value.includes('.')) {
            // Only block if the current active number block already has a decimal
            const parts = display.value.split(/[\+\-\*\/]/);
            if (parts[parts.length - 1].includes('.')) return;
        }
        display.value += number;
    }

    function appendOperator(operator) {
        if (display.value === 'Error') return;
        resetDisplay = false;
        
        const lastChar = display.value.slice(-1);
        if (['+', '-', '*', '/'].includes(lastChar)) {
            display.value = display.value.slice(0, -1) + operator;
        } else if (display.value !== '') {
            display.value += operator;
        }
    }

    function clearDisplay() {
        display.value = '';
    }

    function backspace() {
        if (display.value === 'Error') {
            display.value = '';
        } else {
            display.value = display.value.slice(0, -1);
        }
    }

    function calculate() {
        try {
            if (display.value === '') return;
            
            // Evaluate the string expression securely
            // Using Function instead of eval for standard math string evaluation
            const result = new Function(`return ${display.value}`)();
            
            if (result === Infinity || isNaN(result)) {
                display.value = 'Error';
            } else {
                // Round to 8 decimal places to avoid floating point issues (e.g. 0.1 + 0.2)
                display.value = Number(Math.round(result + 'e8') + 'e-8');
            }
            resetDisplay = true;
        } catch (error) {
            display.value = 'Error';
            resetDisplay = true;
        }
    }
</script>

</body>
</html>

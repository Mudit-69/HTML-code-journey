<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<button onclick="monkeyfunction(110)">Monkey's Favourite Function</button>
</body>
<script>
    function monkeyfunction(x, y) {

        if (y === undefined) {
            y = 444
        }

        document.write((x+y)^(x*y))
    }
</script>

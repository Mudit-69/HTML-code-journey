<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Results</h1>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <script>
        var x = 69;
        var y = 67;
        var z = x + y;
        var a = x - y;
        var b = x * y;
        var c = x / y;
        document.getElementById("demo").innerHTML = "The sum is " + z;
        document.getElementById("demo1").innerHTML = "The difference is " + a;
        document.getElementById("demo2").innerHTML = "The product is " + b;
        document.getElementById("demo3").innerHTML = "The quotient is " + c;
        </script>
        
</body>
</html>
